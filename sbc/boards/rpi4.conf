# Raspberry Pi 4 / 400 / CM4 (64-bit)
BOARD_NAME="Raspberry Pi 4"
BOARD_FAMILY="rpi"
BOOT_SIZE_MB=256
# Bootloader and firmware shipped by Debian for arm64.
EXTRA_PACKAGES="raspberrypi-bootloader firmware-brcm80211"
# File name the RPi firmware loads for 64-bit kernels.
KERNEL_IMAGE="kernel8.img"
# Console for the serial header.
CONSOLE="ttyAMA0,115200"
