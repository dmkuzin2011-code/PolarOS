# Generic ARM64 board booting with U-Boot from an SD card.
# Works for boards where U-Boot is loaded from a raw offset, as most
# Rockchip/Allwinner boards do. Adjust UBOOT_OFFSET for your board.
BOARD_NAME="Generic ARM64 (U-Boot)"
BOARD_FAMILY="uboot"
BOOT_SIZE_MB=256
EXTRA_PACKAGES="u-boot-tools flash-kernel"
KERNEL_IMAGE=""
CONSOLE="ttyS0,115200"
# Raw sector offset where U-Boot is written (Rockchip uses 64, 32 KiB).
UBOOT_OFFSET_SECTORS=64
UBOOT_BINARY=""
