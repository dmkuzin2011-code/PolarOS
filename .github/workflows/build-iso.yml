name: Build PolarOS ISO

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: read
  packages: write

jobs:
  build-iso:
    # Use native ARM64 runner (free for public repos)
    # Much faster than QEMU emulation on x86_64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache apt packages and debootstrap to speed up subsequent builds
      - name: Cache APT packages and debootstrap
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            build/rootfs-cache
          key: ${{ runner.os }}-iso-${{ hashFiles('packaging/**/DEBIAN/control') }}
          restore-keys: |
            ${{ runner.os }}-iso-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            xorriso \
            squashfs-tools \
            dosfstools \
            mtools \
            grub-efi-arm64-bin \
            rsync

      # Make shell scripts executable (in case permissions were lost on Windows commit)
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # Run ISO build without UNIX account (root, no password) + fast mode + rootfs cache
      - name: Build Live ISO
        run: |
          export POLAROS_FAST=1
          export POLAROS_KEEP_ROOTFS=1
          export POLAROS_NO_ACCOUNT=1
          ./scripts/build-iso.sh

      # Verify that the ISO file was actually created
      - name: Verify ISO artifact
        run: |
          ls -lh build/*.iso
          file build/*.iso

      # Upload the ISO as an artifact (available for download for 90 days)
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: polaros-live-iso-arm64
          path: build/polaros-*.iso
          retention-days: 30

  # Additional job: create a GitHub Release when a tag (e.g., v1.0.0) is pushed
  release:
    needs: build-iso
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download ISO Artifact
        uses: actions/download-artifact@v4
        with:
          name: polaros-live-iso-arm64
          path: build/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.iso
          generate_release_notes: true